<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="'Space Grotesk','Heebo',system-ui,sans-serif">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Heebo:wght@400;500;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .he   { font-family: 'Heebo','Space Grotesk',system-ui,sans-serif; direction: rtl; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .sans { font-family: 'Space Grotesk','Heebo',system-ui,sans-serif; }
    </style>

    <!-- Aurora blobs -->
    <radialGradient id="blobR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF2D55" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FF2D55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobP" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#C58FFF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#C58FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobT" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#00E5C7" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#00E5C7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="redMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B89"/>
      <stop offset="50%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#B30030"/>
    </linearGradient>
    <linearGradient id="barCap" x1="0" x2="1">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#FF5577"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>

    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glowR"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1600" height="600" fill="#06080F"/>
  <circle cx="1480" cy="60"  r="360" fill="url(#blobR)" opacity="0.55"/>
  <circle cx="120"  cy="560" r="380" fill="url(#blobT)" opacity="0.45"/>
  <circle cx="820"  cy="640" r="340" fill="url(#blobP)" opacity="0.40"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1599" height="599" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- ===== TOP BAND : BRAND ===== -->
  <!-- logo mark -->
  <g transform="translate(70,52)">
    <rect width="64" height="64" rx="16" fill="url(#redMark)"/>
    <rect x="-3" y="-3" width="70" height="70" rx="18" fill="none" stroke="#FF2D55" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M12 32 h9 l5 -13 7 26 5 -16 5 7 h10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="150" y="80" class="sans" font-size="44" font-weight="700" fill="#fff">QFlow<tspan fill="#FF2D55">.</tspan>os</text>
  <text x="152" y="108" class="mono" font-size="13" letter-spacing="6" fill="#7A7D94">CLINIC OPERATING SYSTEM · v2</text>

  <!-- ECG ticker top-right -->
  <g transform="translate(1010,70)" opacity="0.8">
    <path d="M0 0 H70 l8 -22 10 40 8 -28 6 14 H210 l8 -22 10 40 8 -28 6 14 H320"
          fill="none" stroke="#FF2D55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowR)"/>
    <path d="M0 0 H70 l8 -22 10 40 8 -28 6 14 H210 l8 -22 10 40 8 -28 6 14 H320"
          fill="none" stroke="#FFD0DA" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1530" y="64" text-anchor="end" class="mono" font-size="12" letter-spacing="3" fill="#7A7D94">LIVE · ON-AIR</text>
  <circle cx="1545" cy="60" r="5" fill="#FF2D55"/>

  <line x1="70" y1="138" x2="1530" y2="138" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- ===== LEFT COLUMN : VALUE PROP ===== -->
  <text x="70" y="210" class="mono" font-size="14" letter-spacing="5" fill="#FF5577">01 · המוצר</text>
  <text x="70" y="276" class="he sans" font-size="62" font-weight="800" fill="url(#titleFade)">מערכת ניהול תורים</text>
  <text x="70" y="344" class="he sans" font-size="62" font-weight="800" fill="url(#titleFade)">חכמה לקליניקה</text>

  <text x="70" y="392" class="he" font-size="21" fill="#B6B4C6">פלטפורמת Full-Stack לניהול רופאים, מטופלים ותורים —</text>
  <text x="70" y="420" class="he" font-size="21" fill="#B6B4C6">עם ולידציה, שלמות נתונים ולוח בקרה בזמן אמת.</text>

  <!-- feature pills -->
  <g class="he" font-size="16" font-weight="500">
    <g transform="translate(70,452)">
      <rect width="300" height="40" rx="20" fill="#FF2D55" fill-opacity="0.12" stroke="#FF2D55" stroke-opacity="0.35"/>
      <circle cx="270" cy="20" r="4" fill="#FF5577"/>
      <text x="250" y="26" text-anchor="end" fill="#FF8DA3">מניעת התנגשות תורים</text>
    </g>
    <g transform="translate(388,452)">
      <rect width="330" height="40" rx="20" fill="#00E5C7" fill-opacity="0.10" stroke="#00E5C7" stroke-opacity="0.35"/>
      <circle cx="300" cy="20" r="4" fill="#00E5C7"/>
      <text x="280" y="26" text-anchor="end" fill="#5BEFD9">ולידציה: ת.ז · טלפון · רישיון</text>
    </g>
    <g transform="translate(70,504)">
      <rect width="300" height="40" rx="20" fill="#C58FFF" fill-opacity="0.10" stroke="#C58FFF" stroke-opacity="0.35"/>
      <circle cx="270" cy="20" r="4" fill="#C58FFF"/>
      <text x="250" y="26" text-anchor="end" fill="#D6B3FF">שלמות referential מלאה</text>
    </g>
    <g transform="translate(388,504)">
      <rect width="330" height="40" rx="20" fill="#FFB454" fill-opacity="0.10" stroke="#FFB454" stroke-opacity="0.35"/>
      <circle cx="300" cy="20" r="4" fill="#FFB454"/>
      <text x="280" y="26" text-anchor="end" fill="#FFCB85">לוח בקרה חי + מצב מצגת</text>
    </g>
  </g>

  <!-- divider -->
  <line x1="760" y1="170" x2="760" y2="560" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- ===== MIDDLE/RIGHT : ARCHITECTURE ===== -->
  <text x="800" y="210" class="mono" font-size="14" letter-spacing="5" fill="#00E5C7">02 · איך זה בנוי</text>

  <!-- architecture flow -->
  <g class="mono">
    <!-- helper: node = rounded rect with title -->
    <!-- Browser -->
    <g transform="translate(800,250)">
      <rect width="150" height="78" rx="12" fill="#6BB7FF" fill-opacity="0.10" stroke="#6BB7FF" stroke-opacity="0.5"/>
      <rect width="150" height="3" rx="1.5" fill="#6BB7FF"/>
      <text x="16" y="34" class="sans" font-size="16" font-weight="700" fill="#fff">Browser</text>
      <text x="16" y="56" font-size="10" letter-spacing="1" fill="#6BB7FF">ANY DEVICE</text>
    </g>
    <!-- React -->
    <g transform="translate(1010,250)">
      <rect width="160" height="78" rx="12" fill="#FF2D55" fill-opacity="0.10" stroke="#FF2D55" stroke-opacity="0.5"/>
      <rect width="160" height="3" rx="1.5" fill="#FF2D55"/>
      <text x="16" y="34" class="sans" font-size="16" font-weight="700" fill="#fff">React SPA</text>
      <text x="16" y="56" font-size="10" letter-spacing="1" fill="#FF5577">REACT 18 · VITE 5</text>
    </g>
    <!-- PostgREST -->
    <g transform="translate(1230,250)">
      <rect width="160" height="78" rx="12" fill="#00E5C7" fill-opacity="0.10" stroke="#00E5C7" stroke-opacity="0.5"/>
      <rect width="160" height="3" rx="1.5" fill="#00E5C7"/>
      <text x="16" y="34" class="sans" font-size="16" font-weight="700" fill="#fff">PostgREST</text>
      <text x="16" y="56" font-size="10" letter-spacing="1" fill="#00E5C7">SUPABASE · REST</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(1230,372)">
      <rect width="160" height="86" rx="12" fill="#C58FFF" fill-opacity="0.10" stroke="#C58FFF" stroke-opacity="0.5"/>
      <rect width="160" height="3" rx="1.5" fill="#C58FFF"/>
      <text x="16" y="32" class="sans" font-size="16" font-weight="700" fill="#fff">PostgreSQL</text>
      <text x="16" y="52" font-size="10" letter-spacing="1" fill="#C58FFF">3 TABLES · FK · RLS</text>
      <text x="16" y="70" font-size="10" letter-spacing="0.5" fill="#7A7D94">doctors · patients · appts</text>
    </g>
    <!-- GitHub Pages -->
    <g transform="translate(1010,372)">
      <rect width="160" height="86" rx="12" fill="#6BB7FF" fill-opacity="0.08" stroke="#6BB7FF" stroke-opacity="0.4"/>
      <rect width="160" height="3" rx="1.5" fill="#6BB7FF"/>
      <text x="16" y="32" class="sans" font-size="15" font-weight="700" fill="#fff">GitHub Pages</text>
      <text x="16" y="52" font-size="10" letter-spacing="1" fill="#6BB7FF">STATIC CDN · CI/CD</text>
      <text x="16" y="70" font-size="9.5" letter-spacing="0.5" fill="#7A7D94">deploy on push</text>
    </g>
    <!-- Realtime -->
    <g transform="translate(800,372)">
      <rect width="150" height="86" rx="12" fill="#FFB454" fill-opacity="0.08" stroke="#FFB454" stroke-opacity="0.4"/>
      <rect width="150" height="3" rx="1.5" fill="#FFB454"/>
      <text x="16" y="32" class="sans" font-size="15" font-weight="700" fill="#fff">Realtime</text>
      <text x="16" y="52" font-size="10" letter-spacing="1" fill="#FFB454">WEBSOCKET</text>
      <text x="16" y="70" font-size="9.5" letter-spacing="0.5" fill="#7A7D94">live sync (roadmap)</text>
    </g>

    <!-- edges with particles -->
    <!-- browser -> react -->
    <line x1="950" y1="289" x2="1010" y2="289" stroke="#6BB7FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="980" cy="289" r="4" fill="#6BB7FF"/>
    <!-- react -> postgrest -->
    <line x1="1170" y1="282" x2="1230" y2="282" stroke="#00E5C7" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="1200" cy="282" r="4" fill="#00E5C7"/>
    <!-- postgrest <-> postgres (vertical) -->
    <line x1="1310" y1="328" x2="1310" y2="372" stroke="#C58FFF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="1310" cy="350" r="4" fill="#C58FFF"/>
    <!-- github -> react (up) -->
    <line x1="1090" y1="372" x2="1090" y2="328" stroke="#6BB7FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <circle cx="1090" cy="350" r="4" fill="#6BB7FF"/>
    <!-- postgres -> realtime (curve) -->
    <path d="M1230 415 H980 a16 16 0 0 0 -16 16 V440" fill="none" stroke="#FFB454" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>
    <circle cx="1100" cy="415" r="4" fill="#FFB454"/>
  </g>

  <!-- ===== TECH STACK chips ===== -->
  <text x="800" y="506" class="mono" font-size="13" letter-spacing="4" fill="#7A7D94">STACK</text>
  <g class="mono" font-size="13" fill="#B6B4C6">
    <g transform="translate(800,520)"><rect width="92"  height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="46" y="20" text-anchor="middle">React 18</text></g>
    <g transform="translate(902,520)"><rect width="78"  height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="39" y="20" text-anchor="middle">Vite 5</text></g>
    <g transform="translate(990,520)"><rect width="98"  height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="49" y="20" text-anchor="middle">Supabase</text></g>
    <g transform="translate(1098,520)"><rect width="110" height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="55" y="20" text-anchor="middle">PostgreSQL</text></g>
    <g transform="translate(1218,520)"><rect width="92"  height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="46" y="20" text-anchor="middle">SVG anim</text></g>
    <g transform="translate(1320,520)"><rect width="70"  height="30" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/><text x="35" y="20" text-anchor="middle">RTL</text></g>
  </g>

  <!-- footer URL -->
  <rect x="70" y="566" width="500" height="2" fill="url(#barCap)" opacity="0.6"/>
  <text x="70" y="592" class="mono" font-size="15" letter-spacing="2" fill="#fff">alonktz.github.io/clinic-app</text>
  <text x="1530" y="592" text-anchor="end" class="he" font-size="14" fill="#7A7D94">פרויקט גמר · Full-Stack · React + Supabase + PostgreSQL</text>
</svg>
